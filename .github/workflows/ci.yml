# typecheck → test → 빈 DB 에 마이그레이션 → 실 DB 스모크 → build.
# 하나라도 빨간불이면 병합 · 배포하지 않습니다.
#
# ─── 왜 이 파일이 여기 있나 (2026-11-20) ─────────────────────────────
# 예전 ci.yml 은 바깥 저장소(개인 프로젝트/.github)에만 있었습니다. 그 저장소에는 remote 가 없고,
# GitHub 으로 나가는 것은 이 저장소(arcade-finder/.git)뿐이라 PR 자동 검사가 한 번도 돌지 않았습니다.
# 이 저장소의 루트가 곧 앱 폴더이므로 working-directory 없이 돕니다.
#
# ─── Postgres 서비스 ───────────────────────────────────────────
# 단위 테스트는 DB 없이 돕니다(라우트 테스트가 DB 계층을 대역으로 세움). 그래도 Postgres 를 띄우는
# 이유는 둘입니다.
#   1. `prisma migrate deploy` 를 **빈 DB** 에 처음부터 끝까지 적용해 봅니다 — 운영 첫 설치와 같은 길이고,
#      새 마이그레이션(db/*.sql → prisma/migrations)이 깨져 있으면 여기서 멈춥니다.
#   2. 그 DB 로 tests/prisma-smoke.test.ts 를 돌립니다 — 대역으로는 안 보이는 select 오타 · 관계 이름 ·
#      TypedSQL 파라미터 순서를 실 DB 가 잡습니다. (평소 `npm test` 에서는 PRISMA_SMOKE_URL 이 없어 건너뜁니다)
name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: arcade
          POSTGRES_PASSWORD: arcade-ci
          POSTGRES_DB: arcade_finder_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arcade -d arcade_finder_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_DATABASE_URL: postgresql://arcade:arcade-ci@localhost:5432/arcade_finder_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci   # postinstall 이 prisma generate 까지 한다

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test -- --reporter=dot

      - name: migrate (빈 DB 에 전부 적용)
        run: npm run db:migrate:prisma
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: smoke (실 DB 위의 데이터 계층)
        run: npx vitest run tests/prisma-smoke.test.ts --reporter=dot
        env:
          PRISMA_SMOKE_URL: ${{ env.CI_DATABASE_URL }}

      - name: build
        run: npm run build
        env:
          # 빌드 시점에 굽히는 공개 값. 실제 키가 아니어도 빌드는 됩니다 — 지도는 런타임에 인증합니다.
          NEXT_PUBLIC_NAVER_MAP_KEY_ID: ci-placeholder
          APP_URL: https://ci.invalid
