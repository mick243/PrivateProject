# Prometheus agent 모드 설정 — install-monitoring.sh 가 __…__ 를 채워 /etc/arcade-monitoring/prometheus.yml 로 둔다.
# 서버에서 손으로 고친 것은 다시 설치할 때 덮인다. 고칠 곳은 이 파일(배포 묶음)이다.
#
# agent 모드는 긁어서 보내기만 한다 — 저장 · 질의 · 알림 평가는 Grafana Cloud 가 한다. 그래서 1GB 서버에 둘 수 있다.
# 모든 대상은 127.0.0.1 에만 열려 있다(밖에서 닿지 않는다).
global:
  # Grafana Cloud 는 사용량을 활성 시계열과 1분당 점 수(DPM)로 센다 — 60초면 시계열당 1점이다
  scrape_interval: 60s
  scrape_timeout: 10s
  external_labels:
    env: prod
    host: ncp-micro

scrape_configs:
  # 앱 — start-cluster 의 내부 포트를 각각 긁는다. 3000(프록시)을 긁으면 인스턴스가 번갈아 대답해 카운터가 섞인다
  - job_name: arcade-finder
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/arcade-monitoring/metrics-token
    static_configs:
      - targets: [__APP_TARGETS__]

  # 서버 — 메모리 · 스왑 · CPU · 디스크 (1GB 서버에서 제일 먼저 모자랄 것들)
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  # PostgreSQL — 읽기 전용 감시 계정(arcade_monitor · pg_monitor)
  - job_name: postgres
    static_configs:
      - targets: ['127.0.0.1:9187']

  # Caddy — 앱 앞단에서 본 응답 코드 · 지연. 앱이 못 보는 것(정적 파일 · 봇 · 앱이 죽어 Caddy 가 낸 502)이 여기 잡힌다
  - job_name: caddy
    static_configs:
      - targets: ['127.0.0.1:2019']
    metric_relabel_configs:
      # Caddy 는 Go 런타임 · 관리 API 지표까지 내므로 대시보드 · 알림이 쓰는 것만 남긴다 (무료 등급 시계열 아끼기)
      - source_labels: [__name__]
        regex: 'caddy_http_request_duration_seconds_(bucket|sum|count)|caddy_http_requests_in_flight|caddy_http_request_errors_total|caddy_reverse_proxy_upstreams_healthy'
        action: keep

remote_write:
  - url: '__PUSH_URL__'
    basic_auth:
      username: '__PUSH_USER__'
      password_file: /etc/arcade-monitoring/grafana-cloud-token
    # 1GB 서버라 보내기 큐를 작게 — Grafana Cloud 가 잠깐 안 받아도 WAL 에 쌓였다가 다시 보낸다
    queue_config:
      capacity: 2500
      max_shards: 2
      max_samples_per_send: 1000
